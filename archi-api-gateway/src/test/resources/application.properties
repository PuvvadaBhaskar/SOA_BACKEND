spring.application.name=archi-api-gateway
server.port=0
jwt.secret=TestOnlyJwtSecretForGatewayUnitTests-0123456789abcdef
jwt.issuer=archivalia-auth-service
gateway.shared-secret=test-gateway-secret
eureka.client.enabled=false
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.routes[0].id=book-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://BOOK-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/books/**
