spring.application.name=borrow-service
server.port=0

spring.datasource.url=jdbc:h2:mem:borrow_${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

gateway.shared-secret=test-gateway-secret

borrow.loan-days=7
borrow.extension-days=7
borrow.max-extensions=2
borrow.fine-reconciler.enabled=false

spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.alphanumeric-ids.enabled=true

eureka.client.enabled=false
