spring.application.name=auth-service
server.port=0

spring.datasource.url=jdbc:h2:mem:auth_${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=TestOnlyJwtSecretForAuthServiceTests-0123456789abcdef
jwt.issuer=archivalia-auth-service
jwt.expiration-ms=3600000

admin.username=admin
admin.password=Admin@12345
admin.email=admin@archivalia.test

eureka.client.enabled=false
