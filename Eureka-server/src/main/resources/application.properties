spring.application.name=Eureka-server

server.port=${PORT:8761}

eureka.instance.hostname=localhost
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Self-preservation keeps dead instances in the registry, which makes the
# gateway route to stopped instances during load-balancing demos.
# It is OFF by default for local development; set EUREKA_SELF_PRESERVATION=true in production.
eureka.server.enable-self-preservation=${EUREKA_SELF_PRESERVATION:false}
eureka.server.eviction-interval-timer-in-ms=5000
eureka.server.response-cache-update-interval-ms=3000

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Archivalia Eureka Server
info.app.description=Service registry for the Archivalia Digital Library
