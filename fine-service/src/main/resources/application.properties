
spring.application.name=fine-service

server.port=${PORT:8084}

# ===============================
# MySQL Database Configuration
# ===============================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sosbackend}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Bhaskar@123}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# Fine Calculation
# ===============================

fine.per-day=${FINE_PER_DAY:10.0}

# ===============================
# Gateway Security
# ===============================

gateway.shared-secret=${GATEWAY_SECRET:ArchivaliaDevOnlyGatewaySecret-ChangeMe-0123456789}

# ===============================
# Eureka Client Configuration
# ===============================

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

eureka.client.register-with-eureka=true

eureka.client.fetch-registry=true

eureka.client.healthcheck.enabled=true

eureka.instance.prefer-ip-address=true

eureka.instance.instance-id=${spring.application.name}:${random.value}

eureka.instance.lease-renewal-interval-in-seconds=5

eureka.instance.lease-expiration-duration-in-seconds=15

# ===============================
# Error Configuration
# ===============================

server.error.include-stacktrace=never

server.error.include-exception=false

# ===============================
# Actuator Configuration
# ===============================

management.endpoints.web.exposure.include=health,info

management.endpoint.health.show-details=always

management.info.env.enabled=true

# ===============================
# Application Information
# ===============================

info.app.name=Archivalia Fine Service

info.app.description=Late-return fine calculation and management
